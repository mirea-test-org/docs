name: Publish docs as wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Build wiki pages
        run: python3 src/.github/scripts/build_wiki.py src wiki

      - name: Push wiki
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Нет изменений"; exit 0; }
          git commit -m "Publish from docs@${GITHUB_SHA::7}: ${{ github.event.head_commit.message || 'manual run' }}"
          git push
